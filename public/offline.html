<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  /><meta name="theme-color" content="#173f33" /><title>
    You’re offline | ClassFlow</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f8f4;
      color: #243e35;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 420px;
      text-align: center;
      background: white;
      padding: 40px 28px;
      border: 1px solid #e4e9e1;
      border-radius: 18px;
    }
    .mark {
      margin: auto;
      background: #173f33;
      color: #d4eaa9;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      font-size: 26px;
      font-weight: bold;
    }
    h1 {
      font-size: 27px;
      letter-spacing: -1px;
      margin-top: 26px;
    }
    p {
      color: #6e806d;
      font-size: 15px;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      margin-top: 14px;
      background: #194f3d;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 9px;
    }
    a:focus-visible {
      outline: 3px solid #82a568;
      outline-offset: 4px;
    }
  </style>
  <main>
    <div class="mark">CF.</div>
    <h1>A little pause in the flow.</h1>
    <p>
      You’re offline. Reconnect to see the latest assignments and class updates.
      Your deadlines need a fresh connection.
    </p>
    <a href="/">Try again</a>
  </main>
</html>
